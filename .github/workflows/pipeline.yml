name: GCS to BQ to Spanner and MySQL via Composer

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode SA key
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/sa-key.json

      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=/tmp/sa-key.json \
            --project=crested-acumen-495421-n0
          gcloud config set project crested-acumen-495421-n0
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      # STEP 1 - Upload all files to GCS
      - name: Step 1 - Upload files to GCS
        run: |
          gsutil cp Manu.txt             gs://lumibucket-1/Manu.txt
          gsutil cp scripts/schema.json  gs://lumibucket-1/scripts/schema.json
          gsutil cp scripts/transform.js gs://lumibucket-1/scripts/transform.js
          echo "Done - files uploaded to GCS"

      # STEP 2 - Upload DAG to Composer
      - name: Step 2 - Upload DAG to Composer
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe manu-composer \
            --location=us-central1 \
            --project=crested-acumen-495421-n0 \
            --format="value(config.dagGcsPrefix)")
          echo "Composer DAGs bucket: $COMPOSER_BUCKET"
          gsutil cp dags/manu_pipeline_dag.py $COMPOSER_BUCKET/manu_pipeline_dag.py
          echo "Done - DAG uploaded"

      # STEP 3 - Wait for Composer to parse the DAG
      - name: Step 3 - Wait for DAG to be parsed by Composer
        run: |
          echo "Waiting for Composer to parse the DAG..."
          for i in {1..20}; do
            STATUS=$(gcloud composer environments run manu-composer \
              --location=us-central1 \
              --project=crested-acumen-495421-n0 \
              dags list -- --output=json 2>/dev/null | grep "manu_pipeline" | wc -l)
            echo "Attempt $i - DAG found: $STATUS"
            if [ "$STATUS" -gt "0" ]; then
              echo "DAG is ready!"
              break
            fi
            echo "DAG not ready yet, waiting 30s..."
            sleep 30
          done

      # STEP 4 - Trigger the DAG
      - name: Step 4 - Trigger DAG in Composer
        run: |
          gcloud composer environments run manu-composer \
            --location=us-central1 \
            --project=crested-acumen-495421-n0 \
            dags trigger -- manu_pipeline
          echo "Done - DAG triggered!"

