name: GCS to BQ via Dataflow Template

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode SA key
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/sa-key.json

      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=/tmp/sa-key.json \
            --project=crested-acumen-495421-n0
          gcloud config set project crested-acumen-495421-n0

      # STEP 1 - Upload Manu.txt + helper files to GCS
      - name: Upload files to GCS
        run: |
          gsutil cp Manu.txt           gs://lumibucket-1/Manu.txt
          gsutil cp scripts/schema.json  gs://lumibucket-1/scripts/schema.json
          gsutil cp scripts/transform.js gs://lumibucket-1/scripts/transform.js
          echo "Done - all files uploaded to GCS"

      # STEP 2 - Run official Google Dataflow template (GCS CSV -> BQ)
      - name: Run Dataflow job - GCS to BQ table1
        run: |
          gcloud dataflow jobs run manu-gcs-to-bq \
            --gcs-location=gs://dataflow-templates-us-central1/latest/GCS_Text_to_BigQuery \
            --region=us-central1 \
            --project=crested-acumen-495421-n0 \
            --staging-location=gs://lumibucket-1/dataflow/staging \
            --parameters="\
              javascriptTextTransformGcsPath=gs://lumibucket-1/scripts/transform.js,\
              JSONPath=gs://lumibucket-1/scripts/schema.json,\
              javascriptTextTransformFunctionName=transform,\
              inputFilePattern=gs://lumibucket-1/Manu.txt,\
              outputTable=crested-acumen-495421-n0:demo_dataset.manu_table1,\
              bigQueryLoadingTemporaryDirectory=gs://lumibucket-1/dataflow/temp"
          echo "Dataflow job submitted successfully"

      # STEP 3 - Wait for Dataflow job to finish
      - name: Wait for Dataflow job to complete
        run: |
          echo "Waiting for Dataflow job..."
          for i in {1..20}; do
            STATUS=$(gcloud dataflow jobs list \
              --region=us-central1 \
              --project=crested-acumen-495421-n0 \
              --filter="name=manu-gcs-to-bq" \
              --format="value(state)" \
              --limit=1)
            echo "Job status: $STATUS"
            if [ "$STATUS" = "Done" ]; then
              echo "Dataflow job completed!"
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "Dataflow job failed!"
              exit 1
            fi
            sleep 30
          done

      # STEP 4 - Auto copy table1 to table2
      - name: Copy BQ table1 to table2
        run: |
          bq query \
            --use_legacy_sql=false \
            --project_id=crested-acumen-495421-n0 \
            "CREATE OR REPLACE TABLE \`crested-acumen-495421-n0.demo_dataset.manu_table2\`
             AS SELECT * FROM \`crested-acumen-495421-n0.demo_dataset.manu_table1\`"
          echo "Done - manu_table2 created from manu_table1"