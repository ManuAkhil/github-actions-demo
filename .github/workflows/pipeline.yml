name: GCS to BQ via Dataflow + Auto copy to table2

on:
  push:
    branches:
      - main

env:
  PROJECT: crested-acumen-495421-n0
  REGION: us-central1
  BUCKET: lumibucket-1
  DATASET: demo_dataset

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      # ── SETUP ───────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── STEP 1: Upload Manu.txt to GCS ─────────────────────────────────────
      - name: Upload Manu.txt to GCS
        run: |
          gsutil cp Manu.txt gs://lumibucket-1/Manu.txt
          echo "Uploaded Manu.txt to GCS"

      # ── STEP 2: Upload scripts to GCS ──────────────────────────────────────
      - name: Upload scripts to GCS
        run: |
          gsutil cp scripts/gcs_to_bq_dataflow.py gs://lumibucket-1/scripts/gcs_to_bq_dataflow.py
          echo "Uploaded Dataflow script"

      # ── STEP 3: Submit Dataflow job (GCS -> BQ table1) ─────────────────────
      - name: Submit Dataflow job - GCS to BQ table1
        run: |
          python scripts/gcs_to_bq_dataflow.py \
            --input=gs://lumibucket-1/Manu.txt \
            --bq_table=crested-acumen-495421-n0:demo_dataset.manu_table1 \
            --project=crested-acumen-495421-n0 \
            --bucket=lumibucket-1 \
            --region=us-central1
          echo "Dataflow job submitted for GCS to BQ table1"

      # ── STEP 4: Auto copy BQ table1 -> BQ table2 ───────────────────────────
      - name: Copy BQ table1 to table2 automatically
        run: |
          python scripts/bq_table1_to_table2.py \
            --project=crested-acumen-495421-n0 \
            --dataset=demo_dataset \
            --table1=manu_table1 \
            --table2=manu_table2
          echo "table2 created and data copied from table1"