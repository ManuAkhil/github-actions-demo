name: Simple GCS to BQ Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode SA key
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/sa-key.json

      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=/tmp/sa-key.json \
            --project=crested-acumen-495421-n0
          gcloud config set project crested-acumen-495421-n0

      # STEP 1 - Upload Manu.txt to GCS
      - name: Upload Manu.txt to GCS
        run: |
          gsutil cp Manu.txt gs://lumibucket-1/Manu.txt
          echo "Done - Manu.txt is in GCS"

      # STEP 2 - Load GCS file into BQ table1
      - name: Load GCS to BQ table1
        run: |
          bq load \
            --source_format=CSV \
            --skip_leading_rows=1 \
            --autodetect \
            crested-acumen-495421-n0:demo_dataset.manu_table1 \
            gs://lumibucket-1/Manu.txt
          echo "Done - data loaded into manu_table1"

      # STEP 3 - Auto copy table1 to table2
      - name: Copy BQ table1 to table2
        run: |
          bq query \
            --use_legacy_sql=false \
            --project_id=crested-acumen-495421-n0 \
            "CREATE OR REPLACE TABLE \`crested-acumen-495421-n0.demo_dataset.manu_table2\`
             AS SELECT * FROM \`crested-acumen-495421-n0.demo_dataset.manu_table1\`"
          echo "Done - manu_table2 created from manu_table1"