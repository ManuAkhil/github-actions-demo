name: Upload to GCS and Run Dataproc Job

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Akhil.txt to GCS
        run: |
          gsutil cp Akhil.txt gs://lumibucket-1/Akhil.txt
          echo "Uploaded Akhil.txt"

      - name: Upload Manu.txt to GCS
        run: |
          gsutil cp Manu.txt gs://lumibucket-1/Manu.txt
          echo "Uploaded Manu.txt"

      - name: Upload PySpark scripts to GCS
        run: |
          gsutil cp scripts/gcs_to_bq.py gs://lumibucket-1/scripts/gcs_to_bq.py
          gsutil cp scripts/gcs_to_bq_manu.py gs://lumibucket-1/scripts/gcs_to_bq_manu.py

      - name: Create ephemeral Dataproc cluster
        run: |
          gcloud dataproc clusters create akhil-demo-cluster \
            --region=us-central1 \
            --project=crested-acumen-495421-n0 \
            --single-node \
            --master-machine-type=e2-standard-2 \
            --master-boot-disk-type=pd-standard \
            --master-boot-disk-size=32GB \
            --image-version=2.1-debian11 \
            --max-idle=10m \
            --no-address

      - name: Submit PySpark job for Akhil.txt
        run: |
          gcloud dataproc jobs submit pyspark \
            gs://lumibucket-1/scripts/gcs_to_bq.py \
            --cluster=akhil-demo-cluster \
            --region=us-central1 \
            --project=crested-acumen-495421-n0 \
            --jars=gs://spark-lib/bigquery/spark-bigquery-with-dependencies_2.12-0.32.2.jar \
            -- \
            gs://lumibucket-1/Akhil.txt \
            crested-acumen-495421-n0.demo_dataset.akhil_table \
            lumibucket-1

      - name: Submit PySpark job for Manu.txt
        run: |
          gcloud dataproc jobs submit pyspark \
            gs://lumibucket-1/scripts/gcs_to_bq_manu.py \
            --cluster=akhil-demo-cluster \
            --region=us-central1 \
            --project=crested-acumen-495421-n0 \
            --jars=gs://spark-lib/bigquery/spark-bigquery-with-dependencies_2.12-0.32.2.jar \
            -- \
            gs://lumibucket-1/Manu.txt \
            crested-acumen-495421-n0.demo_dataset.manu_table \
            lumibucket-1

      - name: Delete Dataproc cluster
        if: always()
        run: |
          gcloud dataproc clusters delete akhil-demo-cluster \
            --region=us-central1 \
            --project=crested-acumen-495421-n0 \
            --quiet
