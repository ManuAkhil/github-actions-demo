name: GCS to BQ to Spanner and MySQL via Composer

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode SA key
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/sa-key.json

      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=/tmp/sa-key.json \
            --project=crested-acumen-495421-n0
          gcloud config set project crested-acumen-495421-n0
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      # STEP 1 - Upload all files to GCS
      - name: Step 1 - Upload files to GCS
        run: |
          gsutil cp Manu.txt             gs://lumibucket-1/Manu.txt
          gsutil cp scripts/schema.json  gs://lumibucket-1/scripts/schema.json
          gsutil cp scripts/transform.js gs://lumibucket-1/scripts/transform.js
          echo "Done - files uploaded to GCS"

      # STEP 2 - Upload DAG to Composer
      - name: Step 2 - Upload DAG to Composer
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe manu-composer \
            --location=us-central1 \
            --project=crested-acumen-495421-n0 \
            --format="value(config.dagGcsPrefix)")
          echo "Composer bucket: $COMPOSER_BUCKET"
          gsutil cp dags/manu_pipeline_dag.py $COMPOSER_BUCKET/manu_pipeline_dag.py
          echo "Done - DAG uploaded"

      # STEP 3 - Wait 60s for Composer to parse the DAG
      - name: Step 3 - Wait for Composer to parse DAG
        run: |
          echo "Waiting 60 seconds for Composer to parse the DAG..."
          sleep 60
          echo "Done waiting"

      # STEP 4 - Trigger DAG via Airflow REST API
      - name: Step 4 - Trigger DAG via REST API
        run: |
          # Get Composer Airflow URI
          AIRFLOW_URI=$(gcloud composer environments describe manu-composer \
            --location=us-central1 \
            --project=crested-acumen-495421-n0 \
            --format="value(config.airflowUri)")
          echo "Airflow URI: $AIRFLOW_URI"

          # Get access token
          TOKEN=$(gcloud auth print-access-token)

          # Trigger DAG via REST API
          curl -X POST \
            "${AIRFLOW_URI}/api/v1/dags/manu_pipeline/dagRuns" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"dag_run_id": "triggered_by_github_actions"}' \
            --fail \
            --silent \
            --show-error
          echo "DAG triggered successfully!"

